# NFS demo: one export, mounted by pods on different VMs.
# Replace NFS_SERVER_IP below with the real IP of the VM that exports the folder
# (the control plane VM, if you set the server up there). See ../README.md.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-demo-nfs
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1]
  nfs:
    server: NFS_SERVER_IP
    path: /srv/nfs/shared-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-demo
  namespace: storage-demo
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: storage-demo-nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: storage-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: writer
  template:
    metadata:
      labels:
        app: writer
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      initContainers:
        - name: seed
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              for f in /seed/*; do
                name=$(basename "$f")
                [ -e "/shared/$name" ] || cat "$f" > "/shared/$name"
              done
          volumeMounts:
            - { name: seed, mountPath: /seed }
            - { name: shared, mountPath: /shared }
      containers:
        - name: writer
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date -u +%FT%TZ) written by $(hostname) on $NODE_NAME" >> /shared/log.txt
                sleep 10
              done
          volumeMounts:
            - { name: shared, mountPath: /shared }
      volumes:
        - name: seed
          configMap:
            name: mock-files
        - name: shared
          persistentVolumeClaim:
            claimName: shared-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reader-same-node
  namespace: storage-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reader-same-node
  template:
    metadata:
      labels:
        app: reader-same-node
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: reader
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "--- $(date -u +%T) reader on $NODE_NAME sees:"
                ls -l /shared 2>&1
                tail -n 3 /shared/log.txt 2>&1
                sleep 20
              done
          volumeMounts:
            - { name: shared, mountPath: /shared, readOnly: true }
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: shared-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reader-other-node
  namespace: storage-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reader-other-node
  template:
    metadata:
      labels:
        app: reader-other-node
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
      containers:
        - name: reader
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "--- $(date -u +%T) reader on $NODE_NAME sees:"
                ls -l /shared 2>&1
                tail -n 3 /shared/log.txt 2>&1
                sleep 20
              done
          volumeMounts:
            - { name: shared, mountPath: /shared, readOnly: true }
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: shared-demo
