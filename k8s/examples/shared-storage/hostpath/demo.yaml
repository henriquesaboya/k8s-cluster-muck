# hostPath demo: the folder /srv/shared-demo on each VM's own disk.
# writer and reader-same-node run on the control plane VM, so they share one folder.
# reader-other-node runs on a different VM and gets that VM's own, empty folder.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: storage-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: writer
  template:
    metadata:
      labels:
        app: writer
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      initContainers:
        - name: seed
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              for f in /seed/*; do
                name=$(basename "$f")
                [ -e "/shared/$name" ] || cat "$f" > "/shared/$name"
              done
          volumeMounts:
            - { name: seed, mountPath: /seed }
            - { name: shared, mountPath: /shared }
      containers:
        - name: writer
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date -u +%FT%TZ) written by $(hostname) on $NODE_NAME" >> /shared/log.txt
                sleep 10
              done
          volumeMounts:
            - { name: shared, mountPath: /shared }
      volumes:
        - name: seed
          configMap:
            name: mock-files
        - name: shared
          hostPath:
            path: /srv/shared-demo
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reader-same-node
  namespace: storage-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reader-same-node
  template:
    metadata:
      labels:
        app: reader-same-node
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: reader
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "--- $(date -u +%T) reader on $NODE_NAME sees:"
                ls -l /shared 2>&1
                tail -n 3 /shared/log.txt 2>&1
                sleep 20
              done
          volumeMounts:
            - { name: shared, mountPath: /shared, readOnly: true }
      volumes:
        - name: shared
          hostPath:
            path: /srv/shared-demo
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reader-other-node
  namespace: storage-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reader-other-node
  template:
    metadata:
      labels:
        app: reader-other-node
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
      containers:
        - name: reader
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "--- $(date -u +%T) reader on $NODE_NAME sees:"
                ls -l /shared 2>&1
                tail -n 3 /shared/log.txt 2>&1
                sleep 20
              done
          volumeMounts:
            - { name: shared, mountPath: /shared, readOnly: true }
      volumes:
        - name: shared
          hostPath:
            path: /srv/shared-demo
            type: DirectoryOrCreate
